<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris - Arcade Games</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="styles.css">
    <style>
        #holdCanvas {
            border: 2px solid #00ff88 !important;
            background: #0f0f23;
            border-radius: 6px;
            margin: 0 auto 15px auto;
            display: block;
        }
        #nextCanvas {
            border: 2px solid #ffaa00 !important;
            background: #0f0f23;
            border-radius: 6px;
            margin: 0 auto 15px auto;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Tetris</h1>
        <div class="game-container">
            <div class="game-area">
                <canvas id="gameCanvas" width="300" height="600"></canvas>
                <button class="pause-btn" id="pauseBtn">⏸</button>
                <div id="overlay" class="overlay">
                    <h2>Game Over</h2>
                    <div class="final-score">Score: <span id="finalScore">0</span></div>
                    <div id="rankInfo" class="rank-info"></div>
                    <div id="top10List" class="top10-list"></div>
                    <div class="buttons">
                        <button id="retryBtn">Retry</button>
                    </div>
                </div>
            </div>
            <div class="scoreboard">
                <h3>Score</h3>
                <div class="current-score" id="currentScore">0</div>
                <h3>Level</h3>
                <div class="current-score" id="levelDisplay">1</div>
                <h3>Next</h3>
                <canvas id="nextCanvas" width="100" height="65"></canvas>
                <h3>Hold</h3>
                <canvas id="holdCanvas" width="120" height="80"></canvas>
                <h3>Top 5 Scores</h3>
                <div class="top-scores">
                    <ol id="top5List"></ol>
                </div>
                <div style="margin-top: 20px;">
                    <a href="index.html"><button style="width:100%;">Back to Games</button></a>
                </div>
            </div>
        </div>
    </div>
    <script src="tetris.js"></script>
</body>
</html>
