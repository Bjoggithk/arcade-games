<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris - Arcade Games</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Tetris</h1>
        <div class="game-container">
            <div class="game-area">
                <canvas id="gameCanvas" width="300" height="600"></canvas>
                <div id="overlay" class="overlay">
                    <h2>Game Over</h2>
                    <div class="final-score">Score: <span id="finalScore">0</span></div>
                    <div id="rankInfo" class="rank-info"></div>
                    <div id="top10List" class="top10-list"></div>
                    <div class="buttons">
                        <button id="retryBtn">Retry</button>
                        <button id="backBtn">Back to Games</button>
                    </div>
                </div>
            </div>
            <div class="scoreboard">
                <h3>Score</h3>
                <div class="current-score" id="currentScore">0</div>
                <h3>Level</h3>
                <div class="current-score" id="levelDisplay">1</div>
                <h3>Hold</h3>
                <canvas id="holdCanvas" width="120" height="80" style="background:#0f0f23; border-radius:6px; margin-bottom:15px; display:block;"></canvas>
                <h3>Top 5 Scores</h3>
                <div class="top-scores">
                    <ol id="top5List"></ol>
                </div>
            </div>
        </div>
    </div>
    <script src="tetris.js"></script>
</body>
</html>
